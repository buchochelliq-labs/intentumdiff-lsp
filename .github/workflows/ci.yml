name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build + tests (both crates)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: 1.95.0
      - name: Cache Rust build artefacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            crates/lsp-client
            crates/lsp-server
      # Phase D: the git dep on the private intentumdiff-core needs an org token wired.
      - name: Authenticate cross-repo git deps
        # Private sibling repos (the SDK / the engine) are git dependencies. GITHUB_TOKEN is
        # scoped to THIS repo only, so cargo/pip cannot fetch them without an org-scoped
        # token. Set the SPLIT_REPO_TOKEN secret (PAT or App token with read access to the
        # buchochelliq-labs repos); without it this step warns and the build fails clearly.
        env:
          SPLIT_REPO_TOKEN: ${{ secrets.SPLIT_REPO_TOKEN }}
        run: |
          if [ -n "$SPLIT_REPO_TOKEN" ]; then
            git config --global url."https://x-access-token:${SPLIT_REPO_TOKEN}@github.com/".insteadOf "https://github.com/"
            echo "cross-repo git auth configured"
          else
            echo "::warning::SPLIT_REPO_TOKEN not set - private cross-repo dependencies will fail to fetch"
          fi

      - name: lsp-client tests
        run: cargo test --locked --manifest-path crates/lsp-client/Cargo.toml
      - name: Provision registry-verified parser fixtures
        # The native editor-session acceptance runs the real binary against real parser
        # components. Stage exactly the ones it needs from the immutable
        # intentumdiff-registry pin (REGISTRY_REF in the script: commit -> per-component
        # SHA-256 -> the parser repo's CI artifact at the pinned ref). Fail-closed: a
        # missing or mismatching component fails this step. SPLIT_REPO_TOKEN must carry
        # contents:read on intentumdiff-registry and Actions: Read on the parser repos.
        run: |
          python3 -m pip install "pyyaml>=6.0"
          python3 scripts/provision_lsp_fixtures.py --out "$RUNNER_TEMP/lsp-wasm"
        env:
          GH_TOKEN: ${{ secrets.SPLIT_REPO_TOKEN }}
      - name: lsp-server build + tests (mandatory native acceptance)
        # INTENTUMDIFF_LSP_REQUIRE_ACCEPTANCE turns any missing/unverified fixture or a
        # missing git into a failure instead of a self-skip, and records the binary and
        # component identities in the acceptance record uploaded below.
        run: |
          cargo build --locked --release --manifest-path crates/lsp-server/Cargo.toml
          cargo test --locked --manifest-path crates/lsp-server/Cargo.toml
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
          INTENTUMDIFF_TEST_WASM_DIR: ${{ runner.temp }}/lsp-wasm
          INTENTUMDIFF_LSP_REQUIRE_ACCEPTANCE: "1"
          INTENTUMDIFF_LSP_ACCEPTANCE_RECORD: ${{ runner.temp }}/lsp-acceptance.json
      - name: Upload acceptance identities
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lsp-acceptance
          path: |
            ${{ runner.temp }}/lsp-acceptance.json
            ${{ runner.temp }}/lsp-wasm/provenance.json
          if-no-files-found: warn
