# The native IntentumDiff LSP server (#100, A2.5 S3): a standalone binary replacing the
# pygls `intentumdiff lsp-server` — links the PURE-RUST engine (default-features = false)
# and the generic lsp-client crate's sans-IO codec (the framing is transport-symmetric,
# so client and server share it). Extracted to its own repo at the split (#82).
# Standalone package (excluded from the root workspace) so its [patch]/[profile] apply.

[package]
name = "intentumdiff-lsp-server"
version = "0.1.0"
edition = "2021"
publish = false
description = "Native IntentumDiff LSP server: live semantic-diff diagnostics + code lenses over stdio"
license = "MIT"

[[bin]]
name = "intentumdiff-lsp-server"
path = "src/main.rs"

[dependencies]
intentumdiff-rust-core = { git = "https://github.com/buchochelliq-labs/intentumdiff-core", rev = "80f9c5bf64ff42ef1b7ddf4124c6b19a7ca7695c", default-features = false }
intentumdiff-lsp-client = { path = "../lsp-client" }
serde_json = "1"

[patch.crates-io]
quote = { path = "../../patches/quote" }
zmij = { path = "../../patches/zmij" }
serde_core = { path = "../../patches/serde_core" }

[profile.release]
opt-level = 3
codegen-units = 1
strip = true
